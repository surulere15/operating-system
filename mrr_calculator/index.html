<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRR Calculator | Free AI Built</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --border: #30363d;
            --input-bg: #0d1117;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 900px;
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .visuals {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border);
        }

        .results-bar {
            grid-column: span 2;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .result-card {
            text-align: center;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.2rem;
        }

        .result-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .calculator-grid {
                grid-template-columns: 1fr;
            }
            .results-bar {
                grid-template-columns: 1fr;
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MRR Calculator</h1>
            <p class="subtitle">Simulate growth and project recurring revenue metrics over 12 months.</p>
        </header>

        <div class="calculator-grid">
            <div class="inputs">
                <div class="input-group">
                    <label>Starting MRR ($)</label>
                    <input type="number" id="startingMrr" value="10000" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>ARPU ($ / User)</label>
                    <input type="number" id="arpu" value="50" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>New Users / Month</label>
                    <input type="number" id="newUsers" value="200" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>Monthly Growth Rate (%)</label>
                    <input type="number" id="growthRate" value="5" oninput="calculate()">
                </div>
                <div class="input-group">
                    <label>Churn Rate (%)</label>
                    <input type="number" id="churnRate" value="3" oninput="calculate()">
                </div>
            </div>

            <div class="visuals">
                <canvas id="mrrChart"></canvas>
            </div>
        </div>

        <div class="results-bar">
            <div class="result-card">
                <div class="result-value" id="finalMrr">$0</div>
                <div class="result-label">MRR (Month 12)</div>
            </div>
            <div class="result-card">
                <div class="result-value" id="totalArr">$0</div>
                <div class="result-label">LTM Projected ARR</div>
            </div>
            <div class="result-card">
                <div class="result-value" id="netRetention">0%</div>
                <div class="result-label">Net Retention Rate</div>
            </div>
        </div>
    </div>

    <script>
        let chart;

        function calculate() {
            const start = parseFloat(document.getElementById('startingMrr').value) || 0;
            const arpu = parseFloat(document.getElementById('arpu').value) || 0;
            const newUsers = parseFloat(document.getElementById('newUsers').value) || 0;
            const growth = parseFloat(document.getElementById('growthRate').value) / 100 || 0;
            const churn = parseFloat(document.getElementById('churnRate').value) / 100 || 0;

            let currentMrr = start;
            let currentUsers = start / arpu;
            const labels = [];
            const data = [];

            for (let i = 1; i <= 12; i++) {
                labels.push(`Month ${i}`);
                
                // Growth
                const acquired = newUsers + (currentUsers * growth);
                const lost = currentUsers * churn;
                
                currentUsers = currentUsers + acquired - lost;
                currentMrr = currentUsers * arpu;
                
                data.push(currentMrr.toFixed(2));
            }

            document.getElementById('finalMrr').innerText = `$${Math.round(currentMrr).toLocaleString()}`;
            document.getElementById('totalArr').innerText = `$${Math.round(currentMrr * 12).toLocaleString()}`;
            document.getElementById('netRetention').innerText = `${((1 - churn) * 100).toFixed(1)}%`;

            updateChart(labels, data);
        }

        function updateChart(labels, data) {
            const ctx = document.getElementById('mrrChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Projected MRR',
                        data: data,
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88, 166, 255, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointBackgroundColor: '#58a6ff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#8b949e', callback: value => '$' + value.toLocaleString() }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#8b949e' }
                        }
                    }
                }
            });
        }

        calculate();
    </script>
</body>
</html>
